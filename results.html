<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ผลการเลือกตั้งแบบเรียลไทม์ | กิจกรรมเลือกตั้งคณะกรรมการนักศึกษา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#0F1338; --navy-800:#171C4A; --navy-700:#20265E; --navy-600:#262C68;
  --navy-100:#E7E8F3; --navy-050:#F2F3FA;
  --green-600:#04A868; --green-500:#0FBE79; --green-100:#DFF7EC;
  --paper:#F7F8FC; --ink:#181B2C; --ink-soft:#565B76; --line:#E1E3EF; --white:#FFFFFF;
  --radius:16px; --shadow:0 10px 30px -12px rgba(15,19,56,0.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Sarabun',sans-serif;line-height:1.55;}
h1,h2,h3{font-family:'Kanit',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
.ci-bar{display:flex;height:5px;width:100%;}
.ci-bar span:first-child{width:60%;background:var(--navy-600);}
.ci-bar span:last-child{width:40%;background:var(--green-500);}

.topbar{
  background:linear-gradient(155deg,var(--navy-900) 0%,var(--navy-700) 100%);
  color:#fff;padding:22px 24px;
}
.topbar-inner{max-width:1080px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
.topbar h1{font-size:18px;margin:0;font-weight:600;}
.topbar p{margin:4px 0 0;font-size:12.5px;color:rgba(255,255,255,0.6);}
.vote-cta{
  background:var(--green-500);color:var(--navy-900);font-weight:600;font-size:13.5px;
  padding:10px 20px;border-radius:999px;text-decoration:none;white-space:nowrap;
}
.vote-cta:hover{background:var(--green-600);color:#fff;}

.layout{max-width:1080px;margin:0 auto;padding:28px 24px 60px;}
.top-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:22px;}
.countdown-card{
  flex:1 1 220px;background:var(--navy-900);color:#fff;border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);text-align:center;
}
.countdown-card .label{font-size:12.5px;color:rgba(255,255,255,0.55);margin-bottom:6px;}
.countdown-card .clock{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:600;color:var(--green-500);letter-spacing:1px;}
.countdown-card .sub{font-size:11.5px;color:rgba(255,255,255,0.45);margin-top:4px;}

.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;}
@media (max-width:820px){.grid{grid-template-columns:1fr;}}

.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px;}
.card h2{font-size:16px;margin:0 0 18px;font-weight:600;color:var(--navy-800);}

.bar-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.bar-label{
  width:96px;flex-shrink:0;background:var(--navy-600);color:#fff;border-radius:10px;
  padding:8px 10px;font-size:12px;text-align:center;line-height:1.3;
}
.bar-track-outer{flex:1;position:relative;height:30px;background:var(--navy-050);border-radius:8px;overflow:hidden;}
.bar-fill{height:100%;border-radius:8px;transition:width .6s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:10px;}
.bar-fill span{color:#fff;font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;}
.bar-name{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12.5px;color:var(--navy-800);font-weight:600;z-index:1;}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-left:110px;margin-top:4px;}

.donut-wrap{display:flex;flex-direction:column;align-items:center;}
.donut-total{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;color:var(--navy-800);}
.donut-total-label{font-size:11px;color:var(--ink-soft);}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;margin-top:16px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);}
.legend-dot{width:9px;height:9px;border-radius:50%;}

.turnout-stat{display:flex;justify-content:space-between;margin-top:18px;font-size:12.5px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:14px;}
.turnout-stat b{color:var(--navy-800);font-family:'IBM Plex Mono',monospace;}

.refresh-note{text-align:center;font-size:11.5px;color:var(--ink-soft);margin-top:20px;}
.loading-full{text-align:center;padding:60px 0;color:var(--ink-soft);}

footer{text-align:center;padding:20px;color:var(--ink-soft);font-size:11.5px;}
</style>
</head>
<body>
<div class="ci-bar"><span></span><span></span></div>
<div class="topbar">
  <div class="topbar-inner">
    <div>
      <h1 id="electionName">กิจกรรมเลือกตั้งคณะกรรมการนักศึกษา</h1>
      <p>คณะบริหารธุรกิจ วิทยาเขตอีอีซี · ผลการเลือกตั้งแบบเรียลไทม์</p>
    </div>
    <a class="vote-cta" href="index.html">ใช้สิทธิ์เลือกตั้ง</a>
  </div>
</div>

<div class="layout">
  <div class="top-row">
    <div class="countdown-card">
      <div class="label">นับเวลาถอยหลัง</div>
      <div class="clock mono" id="countdown">--:--:--</div>
      <div class="sub" id="countdownSub">กำลังโหลดกำหนดเวลา...</div>
    </div>
  </div>

  <div id="dashboardBody">
    <div class="loading-full">กำลังโหลดข้อมูลผลการเลือกตั้ง...</div>
  </div>

  <div class="refresh-note" id="refreshNote"></div>
</div>

<footer>Panyapiwat Institute of Management · คณะบริหารธุรกิจ วิทยาเขตอีอีซี</footer>

<script>
/* ================= CONFIGURE THIS ================= */
const API_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";
const REFRESH_MS = 20000; // how often the dashboard re-polls results
/* ==================================================== */

const barColors = ['#04A868','#262C68','#0FBE79','#20265E','#5A9E8A','#464C86'];
const donutColors = ['#262C68','#0FBE79','#5A9E8A','#8890C9','#B7BEE8','#E7E8F3'];

async function apiGet(action){
  const res = await fetch(`${API_URL}?action=${action}`);
  return res.json();
}

/* ---------------- Countdown ---------------- */
let voteEndTime = null;
function tickCountdown(){
  const el = document.getElementById('countdown');
  const sub = document.getElementById('countdownSub');
  if(!voteEndTime){ return; }
  const now = new Date();
  const diff = voteEndTime - now;
  if(diff <= 0){
    el.textContent = '00:00:00';
    sub.textContent = 'ปิดรับการลงคะแนนแล้ว';
    return;
  }
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  el.textContent = [h,m,s].map(v=>String(v).padStart(2,'0')).join(':');
  sub.textContent = 'จนถึงเวลาปิดรับการลงคะแนน';
}

async function loadConfig(){
  try{
    const config = await apiGet('getConfig');
    if(config.ElectionName) document.getElementById('electionName').textContent = config.ElectionName;
    if(config.VoteEnd){
      voteEndTime = new Date(config.VoteEnd);
      tickCountdown();
    }
  } catch(err){ /* ignore, keep placeholder */ }
}

/* ---------------- Results (bars + donut) ---------------- */
function renderDashboard(data){
  const candidates = (data.candidates || []).slice().sort((a,b)=> Number(b.votes) - Number(a.votes));
  const maxVotes = Math.max(1, ...candidates.map(c=>Number(c.votes)||0));

  let barsHtml = candidates.map((c,i)=>{
    const pct = Math.max(4, (Number(c.votes)||0) / maxVotes * 100);
    const color = barColors[i % barColors.length];
    const label = Number(c.number) === 0 ? 'งดออกเสียง' : `หมายเลข ${c.number}`;
    return `
      <div class="bar-row">
        <div class="bar-label">${label}</div>
        <div class="bar-track-outer">
          <div class="bar-name">${c.name || ''}</div>
          <div class="bar-fill" style="width:${pct}%;background:${color};">
            <span>${c.votes || 0}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');

  const years = Object.keys(data.byYear || {});
  const totalVoted = data.totalVoted || 0;
  let donutSvg = '';
  let legendHtml = '';
  if(totalVoted > 0 && years.length){
    const R = 60, CX = 80, CY = 80, STROKE = 24;
    const circumference = 2 * Math.PI * R;
    let offset = 0;
    years.forEach((y,i)=>{
      const count = data.byYear[y];
      const frac = count / totalVoted;
      const dash = frac * circumference;
      const color = donutColors[i % donutColors.length];
      donutSvg += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${color}" stroke-width="${STROKE}"
        stroke-dasharray="${dash} ${circumference-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${CX} ${CY})"/>`;
      offset += dash;
      const pct = Math.round(frac*100);
      legendHtml += `<div class="legend-item"><span class="legend-dot" style="background:${color}"></span>${y} · ${pct}%</div>`;
    });
  }

  document.getElementById('dashboardBody').innerHTML = `
    <div class="grid">
      <div class="card">
        <h2>ผลโหวต</h2>
        ${barsHtml || '<p style="color:var(--ink-soft);font-size:13px;">ยังไม่มีผลโหวต</p>'}
      </div>
      <div class="card">
        <h2>จำนวนผู้มาใช้สิทธิ์</h2>
        <div class="donut-wrap">
          <svg width="160" height="160" viewBox="0 0 160 160">
            ${donutSvg}
            <text x="80" y="76" text-anchor="middle" class="donut-total" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="600" fill="#171C4A">${totalVoted}</text>
            <text x="80" y="94" text-anchor="middle" font-family="Sarabun, sans-serif" font-size="11" fill="#565B76">คน</text>
          </svg>
          <div class="legend">${legendHtml}</div>
        </div>
        <div class="turnout-stat">
          <span>ผู้มีสิทธิ์ทั้งหมด</span><b>${data.totalVoters || 0} คน</b>
        </div>
        <div class="turnout-stat">
          <span>ใช้สิทธิ์แล้ว</span><b>${totalVoted} คน (${data.totalVoters ? Math.round(totalVoted/data.totalVoters*100) : 0}%)</b>
        </div>
      </div>
    </div>
  `;
}

async function loadResults(){
  try{
    const data = await apiGet('getResults');
    renderDashboard(data);
    document.getElementById('refreshNote').textContent = 'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH');
  } catch(err){
    document.getElementById('dashboardBody').innerHTML = '<div class="loading-full">โหลดข้อมูลไม่สำเร็จ กรุณาตรวจสอบการตั้งค่า API_URL ใน README.md</div>';
  }
}

function init(){
  if(API_URL.indexOf('PASTE_YOUR') === 0){
    document.getElementById('dashboardBody').innerHTML = '<div class="loading-full">ยังไม่ได้ตั้งค่า API_URL ในไฟล์นี้ — ดูวิธีตั้งค่าใน README.md</div>';
    return;
  }
  loadConfig();
  loadResults();
  setInterval(tickCountdown, 1000);
  setInterval(loadResults, REFRESH_MS);
  setInterval(loadConfig, REFRESH_MS * 3);
}
init();
</script>
</body>
</html>
